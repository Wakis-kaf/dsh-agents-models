# Agent Modes: one host row owns the mode roster and the config editor.
#
# The shipped modes are *templates* in `builtin-modes.js`, not a list here.
# Reason: the profile patch replaces a row's config wholesale, so a mode list
# written here is copied into the profile on the first save — and from then on
# the copy wins over every later npm update. `templates: builtin` resolves the
# shipped templates at load and stores only the fields an operator changed, as
# per-mode overrides, so a package update still reaches untouched fields.
#
# `persona: false` on a template means one of its plugins owns the prompt
# section (Work Fish ships `dsh-work-fish/core/persona`); mounting the stock
# persona row beside it would register the same section twice.
- insert:
    - id: agent-modes
      name: 'dsh-agents-modes'
      config:
        templates: builtin
